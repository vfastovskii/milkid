# Optuna search space for the fixed-architecture BACE809 cluster-hierarchical MIL model.
#
# Goal for this cycle:
#   - keep architecture fixed exactly as in nos_regression_experiment_config.yaml,
#   - reduce overtraining aggressively,
#   - let the attention/query path train longer,
#   - tune component-specific learning rates and strong regularization.
#
# Every sampled key is an exact dotted path in the base config.  Structural
# choices such as latent dimension, layer counts, attention heads, query-token
# count, clustering method, and max cluster count are fixed in fixed_overrides.

version: 2
base_config: utils/experiment_configs/nos_regression_experiment_config.yaml

objective:
  direction: minimize
  primary_metric: val_rmse
  recommended_trials: 400
  recommended_startup_trials: 40
  secondary_metrics:
    - val_mae
    - val_r2
    - val_pearson
    - val_spearman

fixed_overrides:
  # HPO hygiene: do not write attention/ablation artifacts during trials.
  trainer.log_per_epoch: false
  trainer.save_attention_artifacts: false
  trainer.validation_instance_importance_enabled: false
  trainer.stage_2_launch: false
  trainer.enable_progress_bar: false
  trainer.enable_model_summary: false
  trainer.max_epochs: 100
  trainer.precision: "32-true"
  trainer.checkpoint_monitor: val_rmse
  trainer.overfit_gap_stop_enabled: false
  trainer.attention_refinement_enabled: true
  trainer.attention_refinement_patience: 1
  trainer.attention_refinement_min_delta: 0.005
  trainer.attention_refinement_gap_threshold: 0.15
  trainer.attention_refinement_rel_gap_threshold: 0.15
  trainer.attention_refinement_require_val_worse_than_best: true
  trainer.attention_refinement_lr_factor: 0.01
  trainer.attention_refinement_query_epochs: 35
  trainer.attention_refinement_query_weight_start: 0.0
  trainer.attention_refinement_query_weight_end: 1.0
  trainer.attention_refinement_stop_after_query_epochs: true
  trainer.checkpoint_after_attention_refinement: true
  trainer.checkpoint_min_query_epochs: 25
  model.optim.enable_gradient_tracking: false

  # Fixed data/bag construction.
  data.batch_size: 16
  data.balance_train_batches_by_series: true
  data.cluster_instances: true
  data.cluster_selection_method: silhouette
  data.cluster_max_clusters: 6
  data.cluster_min_clusters: 1
  data.cluster_min_silhouette: 0.08
  data.cluster_distance_threshold: null
  data.cluster_linkage: average
  data.cluster_metric: euclidean

  # Fixed architecture: descriptor embedder.
  model.embedder_kwargs.embed_dim: 512
  model.embedder_kwargs.num_mlp_layers: 3
  model.embedder_kwargs.mlp_expansion: 2.0

  # Fixed architecture: shallow bag self-attention contextualizer.
  model.self_attention_kwargs.num_attn_layers: 2
  model.self_attention_kwargs.num_heads: 2
  model.self_attention_kwargs.attn_mlp_ratio: 1.0
  model.self_attention_kwargs.attn_dropout: 0.0

  # Fixed architecture: hierarchical cross-attention aggregator.
  model.aggregator_kwargs.num_heads: 4
  model.aggregator_kwargs.num_query_tokens: 2
  model.aggregator_kwargs.attn_dropout: 0.0
  model.aggregator_kwargs.use_layer_norm: true
  model.aggregator_kwargs.pool_from: inputs
  model.aggregator_kwargs.pool_v_proj: false
  model.aggregator_kwargs.pool_v_bias: false
  model.aggregator_kwargs.use_temperature: true
  model.aggregator_kwargs.attn_mlp_ratio: 1.0
  model.aggregator_kwargs.bag_repr_source: weighted_sum
  model.aggregator_kwargs.refine_top_k_clusters: 1
  model.aggregator_kwargs.cluster_refinement_mode: soft
  model.aggregator_kwargs.refine_mix_learnable: false
  model.aggregator_kwargs.cluster_separation_max_sim: 0.5
  model.aggregator_kwargs.eps: 1.0e-8

  # Fixed architecture: bag-level predictor.
  model.predictor_kwargs.hidden_dim: 256
  model.predictor_kwargs.num_layers: 2
  model.predictor_kwargs.expansion: 2.0
  model.predictor_kwargs.output_dim: 1

  # Active-prototype library is part of this architecture cycle; keep it on.
  model.active_prototype_kwargs.enabled: true
  model.active_prototype_kwargs.warmup_epochs: 1
  model.active_prototype_kwargs.query_start_epoch: 3
  model.active_prototype_kwargs.query_ramp_epochs: 2
  model.active_prototype_kwargs.query_max_weight: 1.0
  model.active_prototype_kwargs.min_active_prototypes: 16
  model.active_prototype_kwargs.active_threshold: 7.0
  model.active_prototype_kwargs.top_m_candidates: 3
  model.active_prototype_kwargs.candidate_selection: attention_ablation
  model.active_prototype_kwargs.ablation_candidate_pool: 8
  model.active_prototype_kwargs.ablation_attention_weight: 0.5
  model.active_prototype_kwargs.ablation_impact_weight: 0.5
  model.active_prototype_kwargs.ablation_positive_only: true
  model.active_prototype_kwargs.candidate_alpha_key: alpha
  model.active_prototype_kwargs.max_prototypes: 64
  model.active_prototype_kwargs.max_prototypes_per_series: 2
  model.active_prototype_kwargs.create_sim_threshold: 0.80
  model.active_prototype_kwargs.merge_sim_threshold: 0.90
  model.active_prototype_kwargs.ema_momentum: 0.03
  model.active_prototype_kwargs.min_count_to_keep: 3
  model.active_prototype_kwargs.query_top_m_prototypes: 8
  model.active_prototype_kwargs.query_temperature: 0.20
  model.active_prototype_kwargs.query_prefer_same_series: false
  model.active_prototype_kwargs.query_fallback_to_all_series: true
  model.active_prototype_kwargs.use_on_eval: true

  # Optimizer family is fixed; component LRs are sampled below.
  model.optim.scheduler: plateau
  model.optim.lr_patience: 15
  model.optim.factor: 0.01
  model.optim.lr_t_max: 50
  model.optim.eta_min: 0.000005
  model.optim.embedder_lr_factor: 1.0
  model.optim.self_attention_lr_factor: 1.0
  model.optim.aggregator_lr_factor: 1.0
  model.optim.predictor_lr_factor: 1.0
  model.optim.active_query_lr_factor: 1.0

constraints:
  architecture: "fixed"
  latent_dim: 512
  train_series_balanced_batch_size: 16
  checkpointing: "best checkpoint only after attention-refinement query phase has matured"

groups:
  embedder_regularization:
    model.embedder_kwargs.dropout:
      type: categorical
      choices: [0.10, 0.15, 0.20, 0.25]
      note: "Strong dropout because the embedder/predictor overfit earliest."
    model.embedder_kwargs.stochastic_depth:
      type: categorical
      choices: [0.03, 0.05, 0.08, 0.10]

  self_attention_regularization:
    model.self_attention_kwargs.attn_ffn_dropout:
      type: categorical
      choices: [0.05, 0.10, 0.15, 0.20]
      note: "Attention needs longer to learn; regularize FFN, not attention weights."
    model.self_attention_kwargs.attn_stochastic_depth:
      type: categorical
      choices: [0.00, 0.02, 0.05, 0.08]
    model.self_attention_kwargs.attn_residual_scale_init:
      type: categorical
      choices: [0.003, 0.005, 0.010]

  aggregator_regularization:
    model.aggregator_kwargs.dropout:
      type: categorical
      choices: [0.05, 0.10, 0.15, 0.20]
    model.aggregator_kwargs.temperature_init:
      type: categorical
      choices: [0.15, 0.20, 0.30, 0.50]
      note: "Higher temperature starts attention smoother, often less overfit-prone."
    model.aggregator_kwargs.residual_scale_init:
      type: categorical
      choices: [0.003, 0.005, 0.010]
    model.aggregator_kwargs.refine_mix:
      type: categorical
      choices: [0.50, 0.60, 0.70]
    model.aggregator_kwargs.external_query_gate_init:
      type: categorical
      choices: [0.15, 0.25, 0.40]
      note: "Lower values make the bioactive query enter more gently."
    model.aggregator_kwargs.cluster_loss_coeff:
      type: categorical
      choices: [0.003, 0.005, 0.010, 0.020]
    model.aggregator_kwargs.cluster_compactness_weight:
      type: categorical
      choices: [0.75, 1.00, 1.50]
    model.aggregator_kwargs.cluster_separation_weight:
      type: categorical
      choices: [0.05, 0.10, 0.20]

  predictor_regularization:
    model.predictor_kwargs.dropout:
      type: categorical
      choices: [0.10, 0.15, 0.20, 0.25, 0.30]
    model.predictor_kwargs.stochastic_depth:
      type: categorical
      choices: [0.03, 0.05, 0.08, 0.10]
    model.predictor_kwargs.head_dropout:
      type: categorical
      choices: [0.05, 0.10, 0.15, 0.20]

  optimizer:
    model.optim.embedder_lr:
      type: float
      low: 0.000005
      high: 0.000080
      log: true
      note: "Embedder should slow down after early signal is learned."
    model.optim.self_attention_lr:
      type: float
      low: 0.000030
      high: 0.000300
      log: true
      note: "Attention/contextualizer is allowed a higher LR and longer training."
    model.optim.aggregator_lr:
      type: float
      low: 0.000010
      high: 0.000150
      log: true
    model.optim.predictor_lr:
      type: float
      low: 0.000005
      high: 0.000080
      log: true
      note: "Predictor overfits quickly; keep its LR low."
    model.optim.active_query_lr:
      type: float
      low: 0.000020
      high: 0.000250
      log: true
    model.optim.weight_decay:
      type: float
      low: 0.000100
      high: 0.003000
      log: true
      note: "Start this cycle with materially stronger weight decay."

conditional_rules:
  - when: "model.aggregator_kwargs.cluster_loss_coeff == 0.0"
    ignore:
      - model.aggregator_kwargs.cluster_compactness_weight
      - model.aggregator_kwargs.cluster_separation_weight
      - model.aggregator_kwargs.cluster_separation_max_sim

intentionally_fixed:
  architecture: "embedder/self-attention/hierarchical aggregator/predictor dimensions and layer counts are fixed"
  model.embedder_kwargs.embed_dim: 512
  model.embedder_kwargs.num_mlp_layers: 3
  model.self_attention_kwargs.num_attn_layers: 2
  model.self_attention_kwargs.num_heads: 2
  model.aggregator_kwargs.num_heads: 4
  model.aggregator_kwargs.num_query_tokens: 2
  model.predictor_kwargs.hidden_dim: 256
  model.predictor_kwargs.num_layers: 2
  trainer.attention_refinement_gap_threshold: 0.15
  trainer.attention_refinement_query_epochs: 35
  trainer.checkpoint_min_query_epochs: 25
  model.active_prototype_kwargs.enabled: true
  trainer.validation_instance_importance_enabled: false

recommended_two_phase_strategy:
  phase_1:
    trials: 400
    goal: "Fixed architecture and fixed stopping/refinement logic; aggressively tune regularization and component LRs."
    include_groups:
      - embedder_regularization
      - self_attention_regularization
      - aggregator_regularization
      - predictor_regularization
      - optimizer
    force_overrides: {}
  phase_2:
    trials: 400
    goal: "Narrow around the best phase-1 regularization/LR settings under the same stopping/refinement protocol."
    include_groups:
      - optimizer
    force_overrides: {}

recommended_confirmation_strategy:
  phase_3:
    reruns: 100
    top_k_configs: 5
    goal: "Rerun the best fixed-architecture configurations with different seeds, then train one final model with attention exports enabled only if explicitly requested."
