# Focused multi-objective search space. Objectives: maximize val_rmsd_top1, minimize val_rmse.
#
# INVARIANT: architecture AND training are IDENTICAL from trial to trial. HPO varies ONLY
# (a) per-component learning rates and (b) a few active-prototype BANK-FORMATION knobs.
# Everything else — model dims/layers/aggregator structure, embed_dim, batch_size,
# max_epochs, the aggregator-focus curriculum (attention_refinement_*: query max_weight,
# ramp, patience, lr_factor), warmup_epochs, candidate_selection (fixed = blended),
# blend weights, active_threshold — is held fixed at the base config's values, so any
# trial-to-trial difference in val_rmsd_top1 / val_rmse is attributable to LR + bank
# formation alone.
#
# Deliberately NOT tuned (would change architecture or training across trials):
#   - trainer.attention_refinement_query_{max_weight,ramp_epochs}  -> curriculum = TRAINING
#   - model.aggregator_kwargs.external_query_gate_init             -> proj init = ARCHITECTURE
#   - model.active_prototype_kwargs.candidate_selection           -> fixed at 'blended'
base_config: ppl/config/experiment_configs/run_config.yaml

groups:
  # (a) Per-component learning rates. The global model.optim.lr is INERT — every component
  # has an explicit absolute LR in run_config, so component_lr() returns those and never
  # falls back to base_lr. Tune the actual per-component LRs. (self_attention_lr left fixed.)
  learning_rates:
    model.optim.embedder_lr:               # base ~2.5e-5
      type: float
      low: 1.0e-5
      high: 1.0e-4
      log: true
    model.optim.aggregator_lr:             # base ~1.3e-4 — the module the prototype query corrects
      type: float
      low: 3.0e-5
      high: 5.0e-4
      log: true
    model.optim.predictor_lr:              # base ~9.5e-6
      type: float
      low: 3.0e-6
      high: 1.0e-4
      log: true
    model.optim.active_query_lr:           # base ~7e-5 — LR of the active-prototype query builder
      type: float
      low: 2.0e-5
      high: 3.0e-4
      log: true

  # (b) Active-prototype BANK-FORMATION knobs (how the per-epoch bank is built; the
  # selection mechanism itself, candidate_selection=blended, is FIXED). These do not touch
  # architecture or the training curriculum.
  bank_builder:
    model.active_prototype_kwargs.top_m_candidates:       # candidate conformers kept per active molecule.
      type: int                                           # Capped at 4 so it stays BELOW the fixed
      low: 2                                              # ablation_candidate_pool=5 (else re-rank inert).
      high: 4
    # ablation_candidate_pool is FIXED at 5 (run_config) — chosen for speed (5 leave-one-out
    # forwards/molecule). min_active_prototypes is FIXED at 16 (gates query engagement, part of
    # the training schedule that stays constant across trials). Neither is swept.

fixed_overrides:
  trainer.max_epochs: 60
  # Speed: HPO trials skip the expensive attention/embedding exports and per-epoch dumps.
  # The final best-params retrain turns these back on (optuna_final_pipeline._retrain_over_seeds).
  trainer.save_attention_artifacts: false
  trainer.log_per_epoch: false
  trainer.enable_progress_bar: false
  trainer.enable_model_summary: false
