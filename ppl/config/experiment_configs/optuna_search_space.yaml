# Focused multi-objective search space: PRESERVE the architecture, tune the per-component
# learning rates + the active-prototype bank builder. Objectives: maximize val_rmsd_top1,
# minimize val_rmse. NOTE: 9 params is wide for a pure 40-60-trial NSGA-II run (~1 generation,
# closer to random search) — bump the trial budget toward ~100+ for real Pareto evolution.
#
# Deliberately NOT tuned (kept fixed at the base config's values):
#   - architecture: embedder/attention dims & layers, aggregator structure, embed_dim
#   - batch_size (interacts with the series-balanced batching; left fixed)
#   - active_threshold (domain constant: pIC50 >= 7 defines "active")
# Add any of these back only with a much larger trial budget.
base_config: ppl/config/experiment_configs/run_config.yaml

groups:
  # Per-component learning rates. NOTE: the global model.optim.lr is INERT here — every
  # component has an explicit absolute LR in run_config, so component_lr() (ppl/models/
  # lightning/optimization.py) returns those and never falls back to base_lr. Tune the
  # actual per-component LRs instead. (self_attention_lr left fixed.)
  learning_rates:
    model.optim.embedder_lr:               # base ~2.5e-5
      type: float
      low: 1.0e-5
      high: 1.0e-4
      log: true
    model.optim.aggregator_lr:             # base ~1.3e-4 — the module the prototype query corrects
      type: float
      low: 3.0e-5
      high: 5.0e-4
      log: true
    model.optim.predictor_lr:              # base ~9.5e-6
      type: float
      low: 3.0e-6
      high: 1.0e-4
      log: true
    model.optim.active_query_lr:           # base ~7e-5 — LR of the active-prototype query builder
      type: float
      low: 2.0e-5
      high: 3.0e-4
      log: true

  # How strongly / how fast the prototype bank steers attention — the main driver of
  # val_rmsd_top1. These are the EFFECTIVE curriculum knobs; the model-config
  # active_prototype_kwargs.query_{max_weight,ramp_epochs} are INERT while the
  # aggregator-focus curriculum is on, so do NOT tune those.
  bank_query:
    trainer.attention_refinement_query_max_weight:
      type: float
      low: 0.3
      high: 1.0
    trainer.attention_refinement_query_ramp_epochs:
      type: categorical
      choices: [5, 10, 20]

  # How the prototype bank is constructed each epoch.
  bank_builder:
    model.active_prototype_kwargs.candidate_selection:   # grad x input saliency vs attention-ablation
      type: categorical
      choices: [gradient, attention_ablation]
    model.active_prototype_kwargs.top_m_candidates:      # candidate conformers kept per active molecule
      type: int
      low: 2
      high: 6
    model.active_prototype_kwargs.min_active_prototypes: # bank size required before the query engages
      type: categorical
      choices: [8, 12, 16, 20]

fixed_overrides:
  trainer.max_epochs: 60
