<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1270" width="1500" height="1270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<style>
  .t    { font-size:25px; font-weight:700; fill:#0f172a; }
  .st   { font-size:13.5px; fill:#64748b; }
  .pl   { font-size:15px; font-weight:700; fill:#0f172a; }
  .pc   { font-size:13.5px; font-weight:600; fill:#334155; }
  .bt   { font-size:12.5px; font-weight:600; fill:#0f172a; }
  .bx   { font-size:12px; fill:#1e293b; }
  .mu   { font-size:11px; fill:#64748b; }
  .mo   { font-size:12.5px; fill:#1e293b; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .mos  { font-size:11px;   fill:#1e293b; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .panel{ fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.5; }
  .box  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; }
  .ln   { stroke:#94a3b8; stroke-width:1.6; fill:none; }
  .lnA  { stroke:#d97706; stroke-width:1.8; fill:none; }
  .lnB  { stroke:#2563eb; stroke-width:1.8; fill:none; }
</style>

<defs>
  <marker id="ah"  markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#94a3b8"/></marker>
  <marker id="ahA" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#d97706"/></marker>
  <marker id="ahB" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#2563eb"/></marker>
</defs>

<rect width="1500" height="1270" fill="#ffffff"/>

<text class="t"  x="40" y="38">Hierarchical cross-attention MIL with an active-prototype query</text>
<text class="st" x="40" y="62">Conformer bags are attended cluster-first, then instance-wise. A memory of active-conformer prototypes builds a bag-conditioned query; its attention map is blended into the base map under a curriculum weight.</text>

<!-- ===================== (a) input ===================== -->
<rect class="panel" x="40" y="84" width="1420" height="112" rx="10"/>
<text class="pl" x="56" y="106">a</text><text class="pc" x="74" y="106">Bag construction and embedding</text>

<rect class="box" x="58"   y="124" width="176" height="56" rx="6"/>
<text class="bt" x="146" y="147" text-anchor="middle">Conformer bag</text>
<text class="mu" x="146" y="164" text-anchor="middle">one molecule, N poses</text>

<rect class="box" x="259"  y="124" width="176" height="56" rx="6"/>
<text class="bt" x="347" y="147" text-anchor="middle">3D descriptors</text>
<text class="mu" x="347" y="164" text-anchor="middle">[N x F] per bag</text>

<rect class="box" x="460"  y="124" width="176" height="56" rx="6"/>
<text class="bt" x="548" y="147" text-anchor="middle">Scaling</text>
<text class="mu" x="548" y="164" text-anchor="middle">fit on the train split only</text>

<rect class="box" x="661"  y="124" width="176" height="56" rx="6"/>
<text class="bt" x="749" y="147" text-anchor="middle">k-means, k = 20</text>
<text class="mu" x="749" y="164" text-anchor="middle">cluster id per conformer</text>

<rect class="box" x="862"  y="124" width="176" height="56" rx="6"/>
<text class="bt" x="950" y="147" text-anchor="middle">Pad and mask</text>
<text class="mu" x="950" y="164" text-anchor="middle">[B, N_max, F] + key mask</text>

<rect class="box" x="1063" y="124" width="176" height="56" rx="6"/>
<text class="bt" x="1151" y="147" text-anchor="middle">Embedder</text>
<text class="mu" x="1151" y="164" text-anchor="middle">cross-instance mixing</text>

<rect class="box" x="1264" y="124" width="176" height="56" rx="6" stroke="#64748b" stroke-width="1.8"/>
<text class="bt"  x="1352" y="147" text-anchor="middle">h</text>
<text class="mos" x="1352" y="165" text-anchor="middle">[B, N, D]</text>

<path class="ln" d="M234,152 H255"   marker-end="url(#ah)"/>
<path class="ln" d="M435,152 H456"   marker-end="url(#ah)"/>
<path class="ln" d="M636,152 H657"   marker-end="url(#ah)"/>
<path class="ln" d="M837,152 H858"   marker-end="url(#ah)"/>
<path class="ln" d="M1038,152 H1059" marker-end="url(#ah)"/>
<path class="ln" d="M1239,152 H1260" marker-end="url(#ah)"/>

<!-- h fan-out through the channel between (a) and (b/d) -->
<path class="ln" d="M1352,180 V204"/>
<path class="ln" d="M1352,204 H1443 V546 H1428" marker-end="url(#ah)"/>
<text class="mos" x="1437" y="536" text-anchor="end">h</text>
<path class="ln" d="M1352,204 H250 V242" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text class="mu" x="700" y="199" text-anchor="middle">the same conformer embeddings feed the aggregator, the bank, and the query builder</text>

<!-- ===================== (b) bank ===================== -->
<rect class="panel" x="40" y="212" width="420" height="312" rx="10"/>
<text class="pl" x="56" y="234">b</text><text class="pc" x="74" y="234">Active-prototype bank, rebuilt every epoch</text>

<rect class="box" x="56" y="250" width="388" height="52" rx="6"/>
<text class="bx" x="250" y="271" text-anchor="middle">Score conformers of each training bag</text>
<text class="mu" x="250" y="289" text-anchor="middle">leave-one-out ablation impact x base-path attention, label-aware</text>

<rect class="box" x="56" y="316" width="388" height="52" rx="6"/>
<text class="bx" x="250" y="337" text-anchor="middle">Epoch-local candidate buffer</text>
<text class="mu" x="250" y="355" text-anchor="middle">top-m conformers per active-labelled bag</text>

<rect class="box" x="56" y="382" width="388" height="70" rx="6"/>
<text class="bx"  x="250" y="403" text-anchor="middle">Rebuild: group by series, count-weighted</text>
<text class="mos" x="250" y="422" text-anchor="middle">L2-normalised centroids -&gt; P in R^(K x D)</text>
<text class="mu"  x="250" y="440" text-anchor="middle">the buffer is cleared; the bank never accumulates</text>

<rect class="box" x="56" y="466" width="388" height="44" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.4"/>
<text class="bx" x="250" y="486" text-anchor="middle">Release gate:  K &gt;= min_active = 16</text>
<text class="mu" x="250" y="503" text-anchor="middle">below this the model runs the base path only</text>

<path class="ln" d="M250,302 V312" marker-end="url(#ah)"/>
<path class="ln" d="M250,368 V378" marker-end="url(#ah)"/>
<path class="ln" d="M250,452 V462" marker-end="url(#ah)"/>

<!-- ===================== (c) query builder ===================== -->
<rect class="panel" x="40" y="540" width="420" height="330" rx="10"/>
<text class="pl" x="56" y="562">c</text><text class="pc" x="74" y="562">Bag-conditioned active query</text>

<rect class="box" x="56" y="576" width="388" height="44" rx="6"/>
<text class="mos" x="250" y="596" text-anchor="middle">r0 = normalise( masked_mean(h) )</text>
<text class="mu"  x="250" y="612" text-anchor="middle">unit norm, so both halves of the concat below match in scale</text>

<rect class="box" x="56" y="634" width="388" height="62" rx="6"/>
<text class="mos" x="250" y="655" text-anchor="middle">S[i,k] = cos( h_i , P_k )   in R^(N x K)</text>
<text class="mos" x="250" y="674" text-anchor="middle">s_k = max over conformers i</text>
<text class="mu"  x="250" y="690" text-anchor="middle">matches the best pose in the bag, not the bag mean</text>

<rect class="box" x="56" y="710" width="388" height="62" rx="6"/>
<text class="mos" x="250" y="731" text-anchor="middle">same-series mask -&gt; top-m softmax( s / tau )</text>
<text class="mos" x="250" y="750" text-anchor="middle">a = sum_k w_k * P_k</text>
<text class="mu"  x="250" y="766" text-anchor="middle">prototype context; falls back across series when empty</text>

<rect class="box" x="56" y="784" width="388" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text class="mos" x="250" y="809" text-anchor="middle" fill="#7c2d12">q_proto = tanh( W LN[ r0 ; a ] )</text>

<rect class="box" x="56" y="830" width="388" height="34" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text class="mos" x="250" y="851" text-anchor="middle" fill="#7c2d12">g = clamp( max_k s_k , 0 , 1 )   per-bag gate</text>

<path class="ln" d="M250,620 V630" marker-end="url(#ah)"/>
<path class="ln" d="M250,696 V706" marker-end="url(#ah)"/>
<path class="ln" d="M250,772 V780" marker-end="url(#ah)"/>
<path class="ln" d="M56,668 H46 V847 H52" marker-end="url(#ah)" stroke-dasharray="4 3"/>

<path class="ln" d="M250,510 V536" marker-end="url(#ah)" stroke-dasharray="5 4"/>
<text class="mu" x="262" y="530">P</text>

<!-- routed connector: q_proto and g -> active query -->
<path class="lnA" d="M444,804 H469 V281 H504" marker-end="url(#ahA)"/>
<text class="mu" x="466" y="546" transform="rotate(-90 466 546)" text-anchor="middle" fill="#b45309">q_proto ,  g</text>

<!-- ===================== (d) aggregator ===================== -->
<rect class="panel" x="478" y="212" width="982" height="700" rx="10"/>
<text class="pl" x="496" y="234">d</text><text class="pc" x="514" y="234">Hierarchical cross-attention aggregator — the same weights run twice, once per query</text>

<rect class="box" x="510" y="250" width="490" height="62" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text class="bt"  x="755" y="270" text-anchor="middle" fill="#7c2d12">Active query</text>
<text class="mos" x="755" y="289" text-anchor="middle">Q_a = q_cls + g * W_x LN( q_proto )</text>
<text class="mu"  x="755" y="305" text-anchor="middle">a bag resembling no prototype has g ~ 0, so Q_a collapses onto Q_b</text>

<rect class="box" x="1030" y="250" width="390" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text class="bt"  x="1225" y="270" text-anchor="middle" fill="#1e3a8a">Base query</text>
<text class="mos" x="1225" y="289" text-anchor="middle">Q_b = q_cls   (learned, 1 token)</text>
<text class="mu"  x="1225" y="305" text-anchor="middle">carries no prototype information</text>

<path class="lnA" d="M755,312 V330"  marker-end="url(#ahA)"/>
<path class="lnB" d="M1225,312 V330" marker-end="url(#ahB)"/>

<rect x="510" y="334" width="910" height="424" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text class="bt" x="965" y="357" text-anchor="middle" fill="#475569">Shared cross-attention stack — identical parameters, two forward passes</text>

<rect class="box" x="530" y="372" width="870" height="112" rx="6" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.3"/>
<text class="bt" x="546" y="393" fill="#5b21b6">Stage 1 · cluster level</text>
<text class="mo" x="546" y="414">c_j = mean{ h_i : cluster(i) = j }</text>
<text class="mu" x="930" y="414">cluster tokens, C in R^(K_c x D)</text>
<text class="mo" x="546" y="433">q1, A = CrossAttn( Q , C )</text>
<text class="mu" x="930" y="433">key mask = empty clusters</text>
<text class="mo" x="546" y="452">beta = normalise( mean_heads A )</text>
<text class="mu" x="930" y="452">cluster attention, sums to 1</text>
<text class="mu" x="546" y="471">pre-norm attention -&gt; gated residual -&gt; SwiGLU FFN; no positional encoding, bags stay unordered</text>

<path class="ln" d="M965,484 V498" marker-end="url(#ah)"/>

<rect class="box" x="530" y="502" width="870" height="68" rx="6"/>
<text class="mo" x="546" y="524">context = sum_c beta_c * c_c</text>
<text class="mo" x="546" y="543">q_ref   = W [ q1 ; context ]</text>
<text class="mu" x="930" y="524">the cluster decision is carried forward</text>
<text class="mu" x="930" y="543">as the query for the instance stage</text>

<path class="ln" d="M965,570 V584" marker-end="url(#ah)"/>

<rect class="box" x="530" y="588" width="870" height="150" rx="6" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.3"/>
<text class="bt" x="546" y="609" fill="#155e75">Stage 2 · instance level   (cluster_refinement_mode = soft)</text>
<text class="mo" x="546" y="630">q2, B = CrossAttn( q_ref , h )</text>
<text class="mu" x="930" y="630">key mask = padding only</text>
<text class="mo" x="546" y="649">p = normalise( mean_heads B )</text>
<text class="mu" x="930" y="649">raw instance attention</text>
<text class="mo" x="546" y="668">alpha_ref = normalise( p_i * beta_c(i)^lambda )</text>
<text class="mu" x="930" y="668" fill="#155e75">one softmax over every valid conformer</text>
<text class="mo" x="546" y="687">alpha = (1-m) * alpha_clu + m * alpha_ref</text>
<text class="mu" x="930" y="687">m = refine_mix = 1, so alpha = alpha_ref</text>
<text class="mu" x="546" y="712">alpha_clu = beta_c / n_c is the size-normalised, cluster-only baseline that m mixes away</text>

<path class="lnA" d="M755,758 V776"  marker-end="url(#ahA)"/>
<path class="lnB" d="M1225,758 V776" marker-end="url(#ahB)"/>

<rect class="box" x="510" y="780" width="490" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text class="mos" x="755" y="805" text-anchor="middle" fill="#7c2d12">alpha_active   (attention over conformers)</text>

<rect class="box" x="1030" y="780" width="390" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text class="mos" x="1225" y="805" text-anchor="middle" fill="#1e3a8a">alpha_base</text>

<path class="lnA" d="M755,820 V832 H900 V838"  marker-end="url(#ahA)"/>
<path class="lnB" d="M1225,820 V832 H1030 V838" marker-end="url(#ahB)"/>

<rect class="box" x="700" y="842" width="530" height="56" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<text class="mos" x="965" y="864" text-anchor="middle">alpha_final = normalise( (1-w) * alpha_base + w * alpha_active )</text>
<text class="mu"  x="965" y="884" text-anchor="middle">w = curriculum weight; the CLS representation is blended identically</text>

<!-- ===================== (e) read-out ===================== -->
<rect class="panel" x="40" y="928" width="1420" height="140" rx="10"/>
<text class="pl" x="56" y="950">e</text><text class="pc" x="74" y="950">Read-out</text>

<rect class="box" x="60" y="964" width="440" height="88" rx="6"/>
<text class="bt"  x="280" y="986" text-anchor="middle">Bag representation</text>
<text class="mos" x="280" y="1008" text-anchor="middle">z_bag = sum_i alpha_final,i * v(h_i)</text>
<text class="bx"  x="280" y="1026" text-anchor="middle">bag_repr_source = weighted_sum</text>
<text class="mu"  x="280" y="1043" text-anchor="middle">v is an optional value projection</text>

<rect class="box" x="530" y="964" width="440" height="88" rx="6"/>
<text class="bt"  x="750" y="986" text-anchor="middle">Objective</text>
<text class="mos" x="750" y="1008" text-anchor="middle">y_hat = predictor( z_bag )</text>
<text class="bx"  x="750" y="1026" text-anchor="middle">+ cluster-preservation regulariser</text>
<text class="mu"  x="750" y="1043" text-anchor="middle">within-cluster compactness, centroid separation</text>

<rect class="box" x="1000" y="964" width="440" height="88" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text class="bt"  x="1220" y="986" text-anchor="middle" fill="#065f46">Conformer attribution</text>
<text class="mos" x="1220" y="1008" text-anchor="middle">rank conformers by alpha_final</text>
<text class="bx"  x="1220" y="1026" text-anchor="middle">top-k bioactive-pose recovery (KID)</text>
<text class="mu"  x="1220" y="1043" text-anchor="middle">exported per epoch as an attention CSV</text>

<path class="ln" d="M965,898 V920 H280 V960" marker-end="url(#ah)"/>
<path class="ln" d="M500,1008 H526"  marker-end="url(#ah)"/>
<path class="ln" d="M970,1008 H996"  marker-end="url(#ah)"/>

<!-- ===================== (f) schedule ===================== -->
<rect class="panel" x="40" y="1084" width="1420" height="132" rx="10"/>
<text class="pl" x="56" y="1106">f</text><text class="pc" x="74" y="1106">When each mechanism is live, along the epoch axis</text>

<line x1="470" y1="1116" x2="470" y2="1196" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<line x1="760" y1="1116" x2="760" y2="1196" stroke="#cbd5e1" stroke-dasharray="4 4"/>

<text class="bx" x="286" y="1133" text-anchor="end">base attention path</text>
<rect x="300" y="1120" width="1120" height="16" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.1"/>

<text class="bx" x="286" y="1159" text-anchor="end">prototype bank</text>
<rect x="470" y="1146" width="950" height="16" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.1"/>
<text class="mu" x="482" y="1158">collect candidates, rebuild from scratch each epoch</text>

<text class="bx" x="286" y="1185" text-anchor="end">active query weight w</text>
<rect x="760" y="1172" width="660" height="16" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
<text class="mu" x="772" y="1184">w ramps 0 -&gt; 0.8 over 5 epochs; eval uses it only if use_on_eval</text>

<text class="mu" x="300"  y="1208" text-anchor="middle">epoch 0</text>
<text class="mu" x="470"  y="1208" text-anchor="middle">warmup = 2</text>
<text class="mu" x="760"  y="1208" text-anchor="middle">K &gt;= 16 and loss plateau</text>
<text class="mu" x="1420" y="1208" text-anchor="end">end of training</text>

<!-- ===================== footnote ===================== -->
<text class="mu" x="40" y="1242">lambda = cluster_bias_power. The cluster prior enters as a multiplicative bias inside a single softmax over every valid conformer, not as a per-cluster renormalisation — the latter</text>
<text class="mu" x="40" y="1258">lets a 2-member cluster outrank a 100-member one on size alone.   Shapes: B bags, N conformers per padded bag, D embedding width, K_c clusters per bag, K prototypes in the bank.</text>
</svg>
